# =============================================================================
# Agent MCP RAG 配置文件
# =============================================================================
# YAML 格式的主配置文件

# ---------------------------------------------------------------------------
# LLM 配置
# ---------------------------------------------------------------------------
llm:
  # 硅基流动 API（OpenAI 兼容）
  provider: openai
  model: Qwen/Qwen2.5-7B-Instruct
  api_base: https://api.siliconflow.cn/v1
  # api_key 请通过环境变量 OPENAI_API_KEY 设置，不要写在此文件中

  # 生成参数
  max_tokens: 4096
  temperature: 0.7
  top_p: 1.0

  # 重试配置
  max_retries: 3
  retry_delay: 2

# ---------------------------------------------------------------------------
# Embedding 配置
# ---------------------------------------------------------------------------
embedding:
  model: BAAI/bge-large-zh-v1.5
  api_base: https://api.siliconflow.cn/v1

# ---------------------------------------------------------------------------
# RAG 配置
# ---------------------------------------------------------------------------
rag:
  knowledge_dir: ./knowledge
  top_k: 3
  chunk_size: 1000

# ---------------------------------------------------------------------------
# MCP 配置
# ---------------------------------------------------------------------------
mcp:
  servers:
    - name: fetch
      command: uvx
      args: ["mcp-server-fetch"]
    - name: filesystem
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "./output"]

# ---------------------------------------------------------------------------
# Agent 配置
# ---------------------------------------------------------------------------
agent:
  name: Augmented LLM Agent
  max_steps: 10
  timeout: 300
  stuck_timeout: 60

# ---------------------------------------------------------------------------
# CLI Coder 工具配置
# ---------------------------------------------------------------------------
coder_cli:
  enabled: true
  workspace: .
  command_timeout: 30
  max_output_length: 10000
